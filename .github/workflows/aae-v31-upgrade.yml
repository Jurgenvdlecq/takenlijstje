name: AAE v3.1 one-time upgrade

on:
  push:
    branches:
      - claude/aae-v3-1-direct

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[aae-v31-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify v3.1 package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/claude/aae-v3-1-upgrade:refs/remotes/origin/claude/aae-v3-1-upgrade"
          git show "origin/claude/aae-v3-1-upgrade:agentsysteem-adaptive-v3.1.zip" > /tmp/aae-v3.1.zip
          echo "954e99cd06a2dcc7162ab79bcf932e7781ec770fd532f270c1b9a2bd4fc02330  /tmp/aae-v3.1.zip" | sha256sum -c -
          rm -rf /tmp/aae-v3.1
          mkdir -p /tmp/aae-v3.1
          unzip -q /tmp/aae-v3.1.zip -d /tmp/aae-v3.1
          test -f /tmp/aae-v3.1/adaptive-agent-environment-v3.1/install.mjs

      - name: Dry-run installer and enforce exact scope
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/aae-v3.1/adaptive-agent-environment-v3.1
          node "$PKG/install.mjs" --project "$GITHUB_WORKSPACE" > /tmp/aae-plan.json
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/aae-plan.json','utf8'));
          const expected = new Set([
            '.claude/aae/CATALOG.md',
            '.claude/aae/docs/COMMANDS_AND_LIMITS.md',
            '.claude/aae/docs/INSTALLATION.md',
            '.claude/aae/docs/INTEGRATIONS.md',
            '.claude/aae/docs/LIVE_CHECK.md',
            '.claude/aae/docs/SOURCES.md',
            '.claude/aae/docs/WORKFLOW.md',
            '.claude/aae/ENTRY.md',
            '.claude/aae/examples/04-supabase-migration.json',
            '.claude/aae/examples/05-github-pr.json',
            '.claude/aae/runtime/core.mjs',
            '.claude/aae/runtime/events.mjs',
            '.claude/aae/runtime/integrations.mjs',
            '.claude/aae/templates/TASK.template.json',
            '.claude/aae/tests/guard.test.mjs',
            '.claude/aae/tests/helpers.mjs',
            '.claude/aae/tests/integrations.test.mjs',
            '.claude/agents/aae-supervisor.md',
            '.claude/agents/aae-test-writer.md',
            '.claude/settings.json',
            '.claude/aae/managed.json'
          ]);
          if (p.version !== '3.1.0') throw new Error('Unexpected target version: '+p.version);
          if ((p.conflicts||[]).length) throw new Error('Installer conflicts: '+JSON.stringify(p.conflicts));
          const got = new Set((p.operations||[]).map(x=>x.path));
          const missing = [...expected].filter(x=>!got.has(x));
          const extra = [...got].filter(x=>!expected.has(x));
          if (missing.length || extra.length || got.size !== expected.size) {
            throw new Error('Unexpected installer scope. missing='+missing.join(',')+' extra='+extra.join(','));
          }
          console.log('Dry run OK: 21 expected AAE-only operations, 0 conflicts.');
          NODE

      - name: Apply AAE v3.1
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/aae-v3.1/adaptive-agent-environment-v3.1
          node "$PKG/install.mjs" --project "$GITHUB_WORKSPACE" --apply > /tmp/aae-apply.json
          cat /tmp/aae-apply.json

      - name: Verify AAE and tests
        shell: bash
        run: |
          set -euo pipefail
          node .claude/aae/runtime/cli.mjs doctor
          node --test .claude/aae/tests/*.test.mjs

      - name: Verify no app or database files changed
        shell: bash
        run: |
          set -euo pipefail
          expected_file=/tmp/expected-paths.txt
          cat > "$expected_file" <<'EOF'
          .claude/aae/CATALOG.md
          .claude/aae/ENTRY.md
          .claude/aae/docs/COMMANDS_AND_LIMITS.md
          .claude/aae/docs/INSTALLATION.md
          .claude/aae/docs/INTEGRATIONS.md
          .claude/aae/docs/LIVE_CHECK.md
          .claude/aae/docs/SOURCES.md
          .claude/aae/docs/WORKFLOW.md
          .claude/aae/examples/04-supabase-migration.json
          .claude/aae/examples/05-github-pr.json
          .claude/aae/managed.json
          .claude/aae/runtime/core.mjs
          .claude/aae/runtime/events.mjs
          .claude/aae/runtime/integrations.mjs
          .claude/aae/templates/TASK.template.json
          .claude/aae/tests/guard.test.mjs
          .claude/aae/tests/helpers.mjs
          .claude/aae/tests/integrations.test.mjs
          .claude/agents/aae-supervisor.md
          .claude/agents/aae-test-writer.md
          .claude/settings.json
          EOF
          git diff --name-only | sort > /tmp/actual-paths.txt
          sort "$expected_file" -o "$expected_file"
          echo "Changed paths:"
          cat /tmp/actual-paths.txt
          diff -u "$expected_file" /tmp/actual-paths.txt

      - name: Commit exact upgrade and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude
          git rm .github/workflows/aae-v31-upgrade.yml
          git diff --cached --check
          git commit -m "Upgrade Adaptive Agent Environment to v3.1 [aae-v31-complete]"
          git push origin HEAD:claude/aae-v3-1-direct
