<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Nieuwe taak — snel</title><link rel="stylesheet" href="wf.css"></head><body>
<div class="sheetwrap">
  <div class="behind">
    <header class="top"><div><h1>Vandaag</h1><div class="sub">ma 28 september · nog 4 te doen</div></div></header>
  </div>
  <div class="dim"></div>
  <div class="sheet" style="bottom:290px;border-radius:18px 18px 0 0;padding-bottom:10px">
    <div class="grip"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Nieuwe taak</h2><span class="ib" style="border:none">✕</span></div>
    <label class="l">Wat moet er gebeuren?</label>
    <div class="inp val focus">Badkamer <u>zaterdag</u>|</div>
    <div class="hint">"zaterdag" gebruikt als dag · <u>toch in de naam</u></div>
    <label class="l">Wanneer?</label>
    <div class="chips"><span class="chip">Vandaag</span><span class="chip">Morgen</span><span class="chip on">Za 3 okt</span><span class="chip">Zo 4 okt</span><span class="chip">Andere dag…</span></div>
    <div class="hint" style="margin-top:8px">Uiterlijk za 3 okt, einde van de dag · <u>aanpassen</u></div>
    <div class="sw" style="border-top:1px solid #ddd;margin-top:8px"><span>Herhalen</span><span class="toggle"></span></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
      <span class="btn link sm" style="padding:0">Meer instellingen ▾</span>
      <span class="btn pri" style="margin-left:auto;min-width:150px">Toevoegen</span>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:290px;background:#d4d4d4;display:grid;place-items:center;color:#666;font-size:13px">toetsenbord van de telefoon<br>(Enter = Toevoegen)</div>
</div>
</body></html>
