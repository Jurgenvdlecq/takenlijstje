<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Lettertypevergelijking</title>
<style>
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900}
@font-face{font-family:Instrument;src:url(fonts/instrument-sans.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Hanken;src:url(fonts/hanken-grotesk.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Onest;src:url(fonts/onest.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format("woff2");font-weight:100 900}
body{margin:0;background:#f6f4ef;color:#1f1d1a;padding:12px 16px}
.s{border-bottom:1px solid #ddd8cf;padding:8px 0 10px}
.n{font:600 11px/1 monospace;color:#8a8378;margin-bottom:6px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.r{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.t{font-size:17px;font-weight:500}
.m{font-size:13.5px;color:#6b655c}
.w{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:#b4382b}
</style></head><body>
<script>
const fams=[["Figtree","Figtree"],["Instrument Sans","Instrument"],["Hanken Grotesk","Hanken"],["Onest","Onest"],["Inter","Inter"]];
for(const [n,f] of fams){document.write(`<div class="s" style="font-family:${f}"><div class="n">${n}</div><h1>Vandaag</h1><div class="m">ma 28 september · nog 4 te doen</div><div class="r"><span class="t">Tandartsafspraak Kai maken</span><span class="w">vóór 12:00</span></div><div class="r"><span class="t">Fietsband plakken</span><span class="w">2 dagen te laat</span></div><div class="m">↻ elke 3 dagen · Keuken · 0123456789 · één, geüpdatet</div></div>`)}
</script>
</body></html>
